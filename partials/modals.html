<dialog id="booking-modal" class="modal-window" aria-labelledby="booking-title">
    <button class="modal-close" aria-label="Закрити">×</button>
    <div class="modal-content">
        <h3 id="booking-title">Записатися на візит</h3>
        <p>Залиште контакти, і ми підберемо ідеальний час у Запоріжжі</p>

        <form id="booking-form">
            <div class="input-group">
                <input type="text" name="name" placeholder="Ваше ім'я" required autocomplete="name">
            </div>
            <div class="input-group">
                <input type="tel" name="phone" placeholder="+380 (__) ___ __ __" value="+380" required
                    autocomplete="tel">
            </div>
            <div class="input-group">
                <select name="service" required>
                    <option value="" disabled selected>Оберіть послугу</option>
                    <option value="Воскова депіляція">Жіноча депіляція</option>
                    <option value="Догляд за тілом">Чоловіча депіляція</option>
                </select>
            </div>
            <div class="cf-turnstile" data-sitekey="0x4AAAAAACppbzwvZa1GFBX5"></div>
            <button type="submit" class="btn-submit">Надіслати</button>
        </form>
    </div>
</dialog>

<div id="photo-lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Перегляд зображення">
    <button class="lightbox-close" aria-label="Закрити">×</button>

    <button class="lightbox-prev" aria-label="Попередня фотографія">❮</button>
    <button class="lightbox-next" aria-label="Наступна фотографія">❯</button>

    <img class="lightbox-content" id="lightbox-img" alt="Фото галереї крупним планом">
</div>
