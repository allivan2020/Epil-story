<dialog id="booking-modal" class="modal-window">
    <button class="modal-close" aria-label="Закрити">&times;</button>
    <div class="modal-content">
        <h3>Записатися на візит</h3>
        <p>Залиште контакти, і ми підберемо ідеальний час у Запоріжжі</p>

        <form id="booking-form">
            <div class="input-group">
                <input type="text" name="name" placeholder="Ваше ім'я" required>
            </div>
            <div class="input-group">
                <input type="tel" name="phone" placeholder="+38 (0__) ___ __ __" required>
            </div>
            <div class="input-group">
                <select name="service" required>
                    <option value="" disabled selected>Оберіть послугу</option>
                    <option value="Воскова депіляція">Воскова депіляція</option>
                    <option value="Шугаринг">Шугаринг</option>
                    <option value="Догляд за тілом">Догляд за тілом</option>
                </select>
            </div>
            <div class="cf-turnstile" data-sitekey="0x4AAAAAACppbzwvZa1GFBX5"></div>
            <button type="submit" class="btn-submit">Надіслати</button>
        </form>
    </div>
</dialog>

<div id="photo-lightbox" class="lightbox">
    <button class="lightbox-close" aria-label="Закрити">&times;</button>

    <button class="lightbox-prev" aria-label="Попередня">❮</button>
    <button class="lightbox-next" aria-label="Наступна">❯</button>

    <img class="lightbox-content" id="lightbox-img" alt="Фото галереї">
</div>
